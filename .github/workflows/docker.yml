name: Image Docker

on:
  push:
    tags: ['v*']            # une image par release, comme le JAR du Module 4
  pull_request:
    branches: [main]        # sur les PR : on construit sans publier
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nchami-coda/taskops-api   # forcé en dur : github.repository se termine par "-" (faute de frappe historique du nom du depot), ce qui est un format d'image Docker invalide
jobs:
  image:
    name: Construire et publier l'image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write      # droit de pousser sur GHCR
      id-token: write      # signature d'attestation de provenance

    steps:
      - name: Recuperer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Buildx : le moteur de build avance (cache distant, multi-architecture)
      - name: Preparer Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Sur une PR on ne publie pas : inutile de s'authentifier.
      - name: S'authentifier sur GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Jeton fourni automatiquement par GitHub : aucun secret a creer.
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action calcule les tags et labels a partir du contexte Git.
      # Le tag v1.2.0 produira : 1.2.0, 1.2, 1 et latest.
      - name: Calculer les tags et labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=TaskOps API
            org.opencontainers.image.description=API REST de gestion de taches

      - name: Construire et publier
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          # On ne publie QUE sur un tag, jamais depuis une PR
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache partage entre executions : les couches stables sont reutilisees
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Traçabilite : d'ou vient cette image, et que contient-elle ?
          provenance: true
          sbom: true
