# Profil active uniquement dans le conteneur (SPRING_PROFILES_ACTIVE=postgres)
# Les valeurs viennent de l'environnement : rien de sensible ici.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# "update" : Hibernate ajuste le schema sans effacer les donnees.
# En production reelle : "validate" + migrations Flyway ou Liquibase.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# La console H2 n'a plus de sens ici
spring.h2.console.enabled=false